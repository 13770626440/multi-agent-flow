# template_editor/e2e-smoke-test.yaml
# 用途：TC-E2E-00 端到端冒烟测试模板
# 说明：此文件用于验证 Agent 系统基础运行环境，包含最小化但完整的模板定义

template_id: "e2e-smoke-test"
version: "1.0.0"
description: "端到端冒烟测试模板（验证模板加载、Agent 创建、OpenMOSS 注册全链路）"

# 全局输入
input_schema:
  test_message:
    type: string
    required: true
    default: "你好，请确认你的任务管理能力是否正常工作。"
    description: "测试消息"

# 角色定义（三个角色协同工作）
roles:
  coordinator:
    model: "qwen3.6-plus"
    description: "冒烟测试协调者，负责任务调度和结果汇总"
    capabilities:
      - orchestration
      - result_aggregation
      - report_generation
  
  executor:
    model: "qwen3.6-plus"
    description: "冒烟测试执行者，负责执行基础设施检查"
    capabilities:
      - health_check
      - connectivity_test
      - environment_validation
  
  validator:
    model: "qwen3.6-plus"
    description: "冒烟测试验证者，负责验证测试结果并输出验收报告"
    capabilities:
      - result_validation
      - acceptance_testing
      - quality_assurance

# 任务节点（三个角色协同验证链路）
tasks:
  - task_id: "env-check"
    name: "环境基础设施检查"
    type: fixed
    dependencies: []
    target_role: "executor"
    
    execution_context:
      instruction: |
        请执行环境基础设施检查，验证以下组件连通性：
        1. PostgreSQL 数据库连接
        2. Redis 缓存服务
        3. Backend API 健康端点
        4. OpenClaw Agent 运行时
        5. OpenMOSS 调度中心
        6. 容器间网络连通性
        
        测试消息：${input.test_message}
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          status: {type: string, enum: ["healthy", "degraded", "unhealthy"]}
          checks:
            type: array
            items:
              type: object
              properties:
                component: {type: string}
                status: {type: string, enum: ["pass", "fail", "timeout"]}
                latency_ms: {type: number}
                message: {type: string}
          timestamp: {type: string}
        required: ["status", "checks"]
    
    acceptance_criteria:
      - "所有核心组件状态为 pass"
      - "响应时间 < 10 秒"
      - "返回结构化 JSON 结果"
    
    user_confirmation:
      required: false

  - task_id: "template-validation"
    name: "模板加载与解析验证"
    type: fixed
    dependencies: ["env-check"]
    target_role: "executor"
    
    execution_context:
      instruction: |
        请验证模板加载与解析机制：
        1. 确认 template/e2e-smoke-test.yaml 已被 Watchdog 监控捕获
        2. 验证 YAML 语法解析成功
        3. 验证 roles 定义合法性（三个角色）
        4. 验证 tasks DAG 无循环依赖
        5. 验证 Redis 缓存写入成功
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          template_loaded: {type: boolean}
          roles_count: {type: number}
          tasks_count: {type: number}
          dag_valid: {type: boolean}
          redis_cached: {type: boolean}
          issues:
            type: array
            items: {type: string}
        required: ["template_loaded", "roles_count", "dag_valid"]
    
    acceptance_criteria:
      - "模板加载成功"
      - "识别到 3 个角色定义"
      - "DAG 验证通过，无循环依赖"
      - "Redis 缓存写入成功"
    
    user_confirmation:
      required: false

  - task_id: "agent-provisioning"
    name: "Agent 动态供给验证"
    type: fixed
    dependencies: ["template-validation"]
    target_role: "executor"
    
    execution_context:
      instruction: |
        请验证 Agent 动态供给机制：
        1. OpenClaw 成功创建 coordinator 角色实例
        2. OpenClaw 成功创建 executor 角色实例
        3. OpenClaw 成功创建 validator 角色实例
        4. 所有 Agent 状态为 ready
        5. 记录每个 Agent 的初始化时间
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          agents:
            type: array
            items:
              type: object
              properties:
                role: {type: string}
                agent_id: {type: string}
                status: {type: string}
                init_time_ms: {type: number}
          all_ready: {type: boolean}
        required: ["agents", "all_ready"]
    
    acceptance_criteria:
      - "三个角色 Agent 全部创建成功"
      - "所有 Agent 状态为 ready"
      - "单个 Agent 初始化时间 < 5 秒"
    
    user_confirmation:
      required: false

  - task_id: "agency-agent-loading"
    name: "Agency-Agent 角色能力自动加载验证"
    type: fixed
    dependencies: ["agent-provisioning"]
    target_role: "executor"
    
    execution_context:
      instruction: |
        请验证 Agency-Agent 的角色能力自动加载机制：
        
        **验证目标**：确认每个角色在构建 Agent 时，能够根据 roles 定义自动加载对应的能力模块。
        
        **验证步骤**：
        1. 验证 coordinator 角色加载了以下能力：
           - orchestration（任务编排）
           - result_aggregation（结果聚合）
           - report_generation（报告生成）
        
        2. 验证 executor 角色加载了以下能力：
           - health_check（健康检查）
           - connectivity_test（连通性测试）
           - environment_validation（环境验证）
        
        3. 验证 validator 角色加载了以下能力：
           - result_validation（结果验证）
           - acceptance_testing（验收测试）
           - quality_assurance（质量保证）
        
        4. 确认每个 Agent 的能力列表与模板 roles 定义完全一致
        5. 确认能力模块已正确初始化并可用
        
        **输出要求**：
        - 列出每个角色实际加载的能力列表
        - 标记能力加载状态（loaded / missing / error）
        - 记录能力初始化时间
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          roles_capabilities:
            type: array
            items:
              type: object
              properties:
                role: {type: string}
                agent_id: {type: string}
                expected_capabilities:
                  type: array
                  items: {type: string}
                loaded_capabilities:
                  type: array
                  items: {type: string}
                missing_capabilities:
                  type: array
                  items: {type: string}
                status: {type: string, enum: ["all_loaded", "partial", "failed"]}
                init_time_ms: {type: number}
          all_roles_complete: {type: boolean}
        required: ["roles_capabilities", "all_roles_complete"]
    
    acceptance_criteria:
      - "三个角色的能力全部自动加载"
      - "实际加载能力与模板定义完全一致"
      - "无缺失能力模块"
      - "能力初始化时间 < 3 秒/角色"
    
    user_confirmation:
      required: false

  - task_id: "moss-registration"
    name: "OpenMOSS 调度中心注册验证"
    type: fixed
    dependencies: ["agency-agent-loading"]
    target_role: "executor"
    
    execution_context:
      instruction: |
        请验证 OpenMOSS 调度中心注册机制：
        1. coordinator 角色已注册到调度中心
        2. executor 角色已注册到调度中心
        3. validator 角色已注册到调度中心
        4. 每个角色的能力描述正确
        5. 可通过调度中心 API 查询到所有 Agent
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          registered_roles:
            type: array
            items: {type: string}
          registration_complete: {type: boolean}
          api_queryable: {type: boolean}
        required: ["registered_roles", "registration_complete"]
    
    acceptance_criteria:
      - "三个角色全部注册成功"
      - "能力描述与模板定义一致"
      - "可通过 API 查询到所有 Agent"
    
    user_confirmation:
      required: false

  - task_id: "result-aggregation"
    name: "协调者汇总测试结果"
    type: fixed
    dependencies: ["env-check", "template-validation", "agent-provisioning", "agency-agent-loading", "moss-registration"]
    target_role: "coordinator"
    
    execution_context:
      instruction: |
        作为协调者，请汇总所有前置任务的执行结果：
        1. 收集 env-check 的环境检查结果
        2. 收集 template-validation 的模板验证结果
        3. 收集 agent-provisioning 的 Agent 创建结果
        4. 收集 agency-agent-loading 的能力自动加载结果
        5. 收集 moss-registration 的注册结果
        6. 生成汇总报告，标记整体状态
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          overall_status: {type: string, enum: ["PASS", "FAIL", "DEGRADED"]}
          task_results:
            type: object
            properties:
              env-check: {type: object}
              template-validation: {type: object}
              agent-provisioning: {type: object}
              moss-registration: {type: object}
          total_duration_ms: {type: number}
          summary: {type: string}
        required: ["overall_status", "task_results"]
    
    acceptance_criteria:
      - "成功收集所有前置任务结果"
      - "整体状态判定逻辑正确（任一失败则 FAIL）"
      - "汇总报告包含完整的时间线"
    
    user_confirmation:
      required: false

  - task_id: "acceptance-report"
    name: "验证者输出验收报告"
    type: fixed
    dependencies: ["result-aggregation"]
    target_role: "validator"
    
    execution_context:
      instruction: |
        作为验证者，请基于协调者的汇总结果输出最终验收报告：
        
        **PASS 条件**：
        - 环境检查清单全部通过
        - 模板加载成功，三个角色识别正确
        - 三个 Agent 全部创建成功且状态为 ready
        - OpenMOSS 注册成功，API 可查询
        - 总响应时间 < 15 秒
        
        **FAIL 条件**（任一触发即失败）：
        - 任一基础设施不可用
        - 模板解析失败或角色定义错误
        - Agent 创建失败或状态异常
        - OpenMOSS 注册失败
        - 响应时间 > 15 秒
        - 任何报错堆栈泄露
        
        请输出结构化验收报告，包含：
        1. 最终判定（PASS/FAIL）
        2. 失败原因（如有）
        3. 性能指标
        4. 改进建议（如有）
      output_format: "json"
    
    output_definition:
      type: "json"
      schema:
        type: object
        properties:
          verdict: {type: string, enum: ["PASS", "FAIL"]}
          failure_reasons:
            type: array
            items: {type: string}
          performance:
            type: object
            properties:
              total_duration_ms: {type: number}
              env_check_ms: {type: number}
              template_validation_ms: {type: number}
              agent_provisioning_ms: {type: number}
              agency_agent_loading_ms: {type: number}
              moss_registration_ms: {type: number}
          recommendations:
            type: array
            items: {type: string}
        required: ["verdict"]
    
    acceptance_criteria:
      - "验收报告格式符合规范"
      - "最终判定逻辑正确"
      - "包含完整的性能指标"
      - "失败原因描述清晰（如有）"
    
    user_confirmation:
      required: true
      auto_pass_on_smoke_test: true
